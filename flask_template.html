<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIFAR-10 Image Classifier</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }
        
        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }
        
        #fileInput {
            display: none;
        }
        
        .upload-icon {
            font-size: 4em;
            margin-bottom: 15px;
            color: #667eea;
        }
        
        .upload-text {
            color: #555;
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        
        .upload-hint {
            color: #888;
            font-size: 0.9em;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            font-weight: bold;
        }
        
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        #preview {
            margin-top: 20px;
            text-align: center;
            display: none;
        }
        
        #previewImage {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        #results {
            margin-top: 30px;
            display: none;
        }
        
        .result-card {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
        }
        
        .predicted-class {
            font-size: 2em;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .confidence {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 20px;
        }
        
        .top-predictions {
            margin-top: 20px;
        }
        
        .top-predictions h3 {
            color: #555;
            margin-bottom: 15px;
        }
        
        .prediction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: white;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        
        .prediction-label {
            font-weight: 500;
            color: #333;
        }
        
        .prediction-bar {
            flex: 1;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin: 0 15px;
            overflow: hidden;
        }
        
        .prediction-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        .prediction-value {
            font-weight: 600;
            color: #667eea;
            min-width: 50px;
            text-align: right;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        
        .classes-info {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 15px;
        }
        
        .classes-info h3 {
            color: #555;
            margin-bottom: 15px;
        }
        
        .classes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
        }
        
        .class-item {
            background: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9em;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ CIFAR-10 Classifier</h1>
        <p class="subtitle">Upload an image to classify it using deep learning</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📤</div>
            <div class="upload-text">Click to upload or drag and drop</div>
            <div class="upload-hint">PNG, JPG or JPEG (32x32 recommended)</div>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        
        <div id="preview">
            <img id="previewImage" alt="Preview">
        </div>
        
        <button class="btn" id="predictBtn" disabled>Predict</button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: #667eea;">Analyzing image...</p>
        </div>
        
        <div class="error" id="error"></div>
        
        <div id="results">
            <div class="result-card">
                <div class="predicted-class" id="predictedClass"></div>
                <div class="confidence" id="confidence"></div>
                
                <div class="top-predictions">
                    <h3>Top 3 Predictions:</h3>
                    <div id="topPredictions"></div>
                </div>
            </div>
        </div>
        
        <div class="classes-info">
            <h3>Supported Classes:</h3>
            <div class="classes-grid">
                <div class="class-item">✈️ Airplane</div>
                <div class="class-item">🚗 Automobile</div>
                <div class="class-item">🐦 Bird</div>
                <div class="class-item">🐱 Cat</div>
                <div class="class-item">🦌 Deer</div>
                <div class="class-item">🐕 Dog</div>
                <div class="class-item">🐸 Frog</div>
                <div class="class-item">🐴 Horse</div>
                <div class="class-item">🚢 Ship</div>
                <div class="class-item">🚚 Truck</div>
            </div>
        </div>
    </div>
    
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const previewImage = document.getElementById('previewImage');
        const predictBtn = document.getElementById('predictBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const error = document.getElementById('error');
        
        let selectedFile = null;
        
        // Click to upload
        uploadArea.addEventListener('click', () => fileInput.click());
        
        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        });
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });
        
        function handleFile(file) {
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                preview.style.display = 'block';
                predictBtn.disabled = false;
                results.style.display = 'none';
                error.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
        
        predictBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            const formData = new FormData();
            formData.append('file', selectedFile);
            
            loading.style.display = 'block';
            results.style.display = 'none';
            error.style.display = 'none';
            predictBtn.disabled = true;
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                displayResults(data);
            } catch (err) {
                error.textContent = `Error: ${err.message}`;
                error.style.display = 'block';
            } finally {
                loading.style.display = 'none';
                predictBtn.disabled = false;
            }
        });
        
        function displayResults(data) {
            document.getElementById('predictedClass').textContent = 
                data.predicted_class.charAt(0).toUpperCase() + data.predicted_class.slice(1);
            document.getElementById('confidence').textContent = 
                `Confidence: ${(data.confidence * 100).toFixed(2)}%`;
            
            const topPredictions = document.getElementById('topPredictions');
            topPredictions.innerHTML = data.top_3.map(pred => `
                <div class="prediction-item">
                    <span class="prediction-label">${pred.class}</span>
                    <div class="prediction-bar">
                        <div class="prediction-fill" style="width: ${pred.probability * 100}%"></div>
                    </div>
                    <span class="prediction-value">${(pred.probability * 100).toFixed(1)}%</span>
                </div>
            `).join('');
            
            results.style.display = 'block';
        }
    </script>
</body>
</html>
